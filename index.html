<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-4-code-examples</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="bg-fixed">
    <main
      class="w-full h-dvh gap-6 flex flex-1 flex-row flex-wrap items-center justify-center p-6"
    >
      <!-- default card -->
      <div class="card bg-sky-200 px-6 py-4" style="width: 15rem">
        <div class="layout flex flex-0 flex-col gap-4 items-center">
          <h3 class="text-2xl font-bold">The Ceiling Is Haunted</h3>
          <img src="/corner_stare.jpg" alt="" />
          <div class="body">
            <p>
              Grizelle was <em>very</em> suspicious of the corner of the
              ceiling.
            </p>
          </div>
        </div>
      </div>
      <div class="card bg-sky-200 px-6 py-4" style="width: 15rem">
        <div class="layout flex flex-0 flex-col gap-4 items-center">
          <h3 class="text-2xl font-bold">Dialect Map</h3>
          <img src="/dialect-map.png" alt="" />
          <div class="body">
            <p>
              Unsurpringly, the guy who has spent most of his life in the
              Northeast talks like someone from the Northeast.
            </p>
          </div>
        </div>
      </div>
      <div class="card bg-sky-200 px-6 py-4" style="width: 15rem">
        <div class="layout flex flex-0 flex-col gap-4 items-center">
          <h3 class="text-2xl font-bold">Muehuehuehue</h3>
          <img src="/muehue.gif" alt="" />
          <div class="body">
            <p>This cat has only good things in mind.</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
