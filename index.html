<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ai-4-js-demo</title>
  </head>
  <body class="bg-slate-700 text-white px-4 py-3">
    <h1>Hello world!</h1>
    <div id="app" class="flex flex-col gap-3 px-4 py-3">
      <h1>Guess! The! Number!</h1>
      <div id="guess_display">50</div>
      <input
        id="guess_input"
        type="range"
        min="0"
        max="99"
        step="1"
        value="50"
      />
      <div id="result_display"></div>
      <button
        id="submit_button"
        class="bg-emerald-700 p-1 rounded-md active:bg-emerald-600"
      >
        Guess?
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
